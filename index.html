<!DOCTYPE html>
<html>
<head>

<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>Kamera Absensi MTsN 8 Kediri</title>

<style>

body {
  margin:0;
  padding:15px;
  font-family:Arial;
  background:#eef7f1;
  text-align:center;
}

.box {
  max-width:480px;
  margin:auto;
  background:white;
  padding:20px;
  border-radius:20px;
  box-shadow:0 4px 15px rgba(0,0,0,.15);
}

h2 {
  color:#087443;
}

video {
  width:100%;
  background:#000;
  border-radius:15px;
  margin-top:15px;
}

button {
  width:100%;
  padding:16px;
  margin-top:15px;
  border:0;
  border-radius:10px;
  background:#087443;
  color:white;
  font-size:17px;
  font-weight:bold;
}

button:disabled {
  background:#999;
}

#status {
  margin-top:15px;
  font-weight:bold;
  line-height:1.6;
}

</style>

</head>

<body>

<div class="box">

<h2>📷 KAMERA ABSENSI</h2>

<p>MTsN 8 Kediri</p>

<video
  id="kamera"
  autoplay
  muted
  playsinline>
</video>

<button
  id="btnKamera"
  onclick="bukaKamera()">

📷 BUKA KAMERA

</button>

<button
  id="btnFoto"
  onclick="ambilFoto()"
  disabled>

📸 AMBIL FOTO

</button>

<canvas
  id="canvas"
  style="display:none">
</canvas>

<div id="status">
Silakan tekan BUKA KAMERA
</div>

</div>


<script>

const params =
new URLSearchParams(
window.location.search
);

const token =
params.get("token");

const returnURL =
params.get("return");

let stream = null;


// ================================
// BUKA KAMERA
// ================================

async function bukaKamera() {

const status =
document.getElementById("status");

const kamera =
document.getElementById("kamera");

try {

status.innerHTML =
"⏳ Meminta izin kamera...";


// Cek dukungan kamera

if (!navigator.mediaDevices) {

throw new Error(
"Browser tidak menyediakan mediaDevices."
);

}

if (!navigator.mediaDevices.getUserMedia) {

throw new Error(
"getUserMedia tidak tersedia."
);

}


// Minta kamera depan

stream =
await navigator.mediaDevices.getUserMedia({

video: {
facingMode: {
ideal: "user"
},
width: {
ideal: 1280
},
height: {
ideal: 720
}
},

audio:false

});


kamera.srcObject =
stream;


// Tunggu kamera aktif

await kamera.play();


document.getElementById(
"btnFoto"
).disabled = false;


status.innerHTML =
"✅ Kamera berhasil dibuka.<br>" +
"Silakan tekan AMBIL FOTO.";

}

catch(error) {

console.error(error);

status.innerHTML =
"❌ Kamera gagal dibuka.<br><br>" +
error.name +
"<br>" +
error.message;


alert(
"Kamera gagal dibuka.\n\n" +
error.name +
"\n" +
error.message +
"\n\n" +
"Pastikan izin kamera browser sudah diizinkan."
);

}

}


// ================================
// AMBIL FOTO
// ================================

function ambilFoto() {

const kamera =
document.getElementById("kamera");

const canvas =
document.getElementById("canvas");

const status =
document.getElementById("status");


if (!kamera.videoWidth) {

alert(
"Kamera belum siap."
);

return;

}


canvas.width =
kamera.videoWidth;

canvas.height =
kamera.videoHeight;


const ctx =
canvas.getContext("2d");


ctx.drawImage(
kamera,
0,
0,
canvas.width,
canvas.height
);


const foto =
canvas.toDataURL(
"image/jpeg",
0.7
);


// Matikan kamera

if (stream) {

stream
.getTracks()
.forEach(
function(track) {
track.stop();
}
);

}


status.innerHTML =
"✅ Foto berhasil diambil.<br>" +
"Menyiapkan pengiriman...";


// Simpan foto sementara

sessionStorage.setItem(
"fotoAbsensi",
foto
);


// Kembali ke aplikasi

if (returnURL) {

const separator =
returnURL.includes("?")
? "&"
: "?";

window.location.href =
returnURL +
separator +
"token=" +
encodeURIComponent(token);

}

else {

window.location.href =
"https://script.google.com/macros/s/AKfycbwDgGxOWo8dmFxOtwPXbcb9m_eDTkjtW5yqNsKeGsIqGax0SYFYZ0lClzFqDTAtkMrM/exec" +
"?token=" +
encodeURIComponent(token);

}

}

</script>

</body>
</html>

```html
<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"

  <title>
    Kamera Absensi MTsN 8 Kediri
  </title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      padding: 15px;

      font-family: Arial, sans-serif;

      background: #eef7f1;

    .container {

      max-width: 480px;

      box-shadow:
        0 4px 15px
        rgba(0,0,0,.15);

    }

      color: #087443;

      width: 100%;

    }

      line-height: 1.6;

    }

  </style>

</head>


<body>


<div class="container">


  <h2>
    📷 KAMERA ABSENSI
  </h2>


  <p>
    MTsN 8 Kediri
  </p>


  <video
    id="kamera"
    autoplay
    muted
    playsinline>
  </video>


  <button
    id="btnKamera"
    onclick="bukaKamera()">

    📷 BUKA KAMERA

  </button>


  <button
    id="btnFoto"
    onclick="ambilFoto()"
    disabled>

    📸 AMBIL FOTO

  </button>


  <canvas
    id="canvas"
    style="display:none;">
  </canvas>


  <img
    id="hasil">


  <div id="status">

    Silakan tekan BUKA KAMERA.

  </div>


</div>


<script>


// =====================================================
// PARAMETER
// =====================================================

const params =
  new URLSearchParams(
    window.location.search
  );


const token =
  params.get("token");


const returnURL =
  params.get("return");


let stream = null;


// =====================================================
// BUKA KAMERA
// =====================================================

async function bukaKamera() {


  const video =
    document.getElementById(
      "kamera"
    );


  const btnKamera =
    document.getElementById(
      "btnKamera"
    );


  const btnFoto =
    document.getElementById(
      "btnFoto"
    );


  const status =
    document.getElementById(
      "status"
    );


  try {


    status.innerHTML =
      "⏳ Meminta izin kamera...";


    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        "Browser tidak mendukung kamera."
      );

    }


    stream =
      await navigator
        .mediaDevices
        .getUserMedia({

          video: {

            facingMode: {
              ideal: "user"
            },

            width: {
              ideal: 1280
            },

            height: {
              ideal: 720
            }

          },

          audio: false

        });


    video.srcObject =
      stream;


    await video.play();


    btnKamera.disabled =
      true;


    btnFoto.disabled =
      false;


    status.innerHTML =
      "✅ Kamera berhasil dibuka.<br>" +
      "Silakan tekan AMBIL FOTO.";


  }

  catch(error) {


    console.error(error);


    status.innerHTML =

      "❌ Kamera gagal dibuka.<br><br>" +

      error.name +
      "<br>" +

      error.message;


  }

}


// =====================================================
// AMBIL FOTO
// =====================================================

async function ambilFoto() {


  const video =
    document.getElementById(
      "kamera"
    );


  const canvas =
    document.getElementById(
      "canvas"
    );


  const hasil =
    document.getElementById(
      "hasil"
    );


  const status =
    document.getElementById(
      "status"
    );


  if (
    !video.videoWidth
  ) {

    alert(
      "Kamera belum siap."
    );

    return;

  }


  // ===================================================
  // UKURAN FOTO
  // ===================================================

  let lebar =
    video.videoWidth;


  let tinggi =
    video.videoHeight;


  // Batasi agar foto tidak terlalu besar

  if (lebar > 900) {

    const skala =
      900 / lebar;

    lebar = 900;

    tinggi =
      Math.round(
        tinggi * skala
      );

  }


  canvas.width =
    lebar;


  canvas.height =
    tinggi;


  // ===================================================
  // GAMBAR
  // ===================================================

  const ctx =
    canvas.getContext("2d");


  ctx.drawImage(

    video,

    0,
    0,

    lebar,
    tinggi

  );


  // ===================================================
  // KOMPRES FOTO
  // ===================================================

  const foto =
    canvas.toDataURL(
      "image/jpeg",
      0.65
    );


  hasil.src =
    foto;


  hasil.style.display =
    "block";


  status.innerHTML =
    "⏳ Mengirim foto...";


  // ===================================================
  // MATIKAN KAMERA
  // ===================================================

  if (stream) {

    stream
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );

  }


  // ===================================================
  // KIRIM KE APPS SCRIPT
  // ===================================================

  try {


    const response =
      await fetch(

        "https://script.google.com/macros/s/AKfycbw0Nf562T16J3pZoy8iFlka8vNtw1v6_dlHCVJEsSc-LevJc4nYjQeQyaMzJtxh7beTMg/exec",

        {

          method: "POST",

          headers: {

            "Content-Type":
              "text/plain;charset=utf-8"

          },

          body:
            JSON.stringify({

              token:
                token,

              foto:
                foto

            })

        }

      );


    status.innerHTML =
      "✅ FOTO BERHASIL DIAMBIL.<br>" +
      "Mengembalikan ke aplikasi...";


    // =================================================
    // KEMBALI KE APLIKASI
    // =================================================

    setTimeout(
      function() {


        if (returnURL) {

          const separator =
            returnURL.includes("?")
              ? "&"
              : "?";


          window.location.href =

            returnURL +

            separator +

            "token=" +

            encodeURIComponent(
              token
            );

        }

      },
      700
    );


  }

  catch(error) {


    console.error(error);


    status.innerHTML =

      "❌ Foto gagal dikirim.<br><br>" +

      error.message;


  }

}

</script>


</body>

</html>

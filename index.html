<!DOCTYPE html>
<html>
<head>

<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>Kamera Absensi MTsN 8 Kediri</title>

<style>

body {
  margin: 0;
  padding: 15px;
  font-family: Arial, sans-serif;
  background: #eef7f1;
  text-align: center;
}

.container {
  max-width: 480px;
  margin: auto;
  background: white;
  padding: 20px;
  border-radius: 20px;
  box-shadow: 0 4px 15px rgba(0,0,0,.15);
}

h2 {
  color: #087443;
}

video {
  width: 100%;
  border-radius: 15px;
  background: #000;
  margin-top: 15px;
}

button {
  width: 100%;
  padding: 16px;
  margin-top: 15px;
  border: none;
  border-radius: 10px;
  background: #087443;
  color: white;
  font-size: 17px;
  font-weight: bold;
}

#status {
  margin-top: 15px;
  font-weight: bold;
  line-height: 1.6;
}

</style>

</head>

<body>

<div class="container">

<h2>📷 KAMERA ABSENSI</h2>

<p>MTsN 8 Kediri</p>

<video
id="kamera"
autoplay
muted
playsinline>
</video>

<button onclick="bukaKamera()">
📷 BUKA KAMERA
</button>

<button
id="btnFoto"
onclick="ambilFoto()"
disabled>

📸 AMBIL FOTO

</button>

<canvas
id="canvas"
style="display:none">
</canvas>

<div id="status">
Silakan tekan BUKA KAMERA
</div>

</div>

<script>

let stream = null;


// ==============================
// BUKA KAMERA
// ==============================

async function bukaKamera() {

const video =
document.getElementById("kamera");

const status =
document.getElementById("status");

try {

status.innerHTML =
"⏳ Meminta akses kamera...";


stream =
await navigator.mediaDevices.getUserMedia({

video: true,

audio: false

});


video.srcObject = stream;

await video.play();


document.getElementById(
"btnFoto"
).disabled = false;


status.innerHTML =
"✅ KAMERA BERHASIL DIBUKA";


}

catch(error) {

console.error(error);

status.innerHTML =
"❌ Kamera gagal dibuka.<br><br>" +
error.name +
"<br>" +
error.message;

alert(
error.name +
"\n\n" +
error.message
);

}

}


// ==============================
// AMBIL FOTO
// ==============================

function ambilFoto() {

const video =
document.getElementById("kamera");

const canvas =
document.getElementById("canvas");

if (!video.videoWidth) {

alert(
"Kamera belum siap."
);

return;

}


canvas.width =
video.videoWidth;

canvas.height =
video.videoHeight;


const ctx =
canvas.getContext("2d");


ctx.drawImage(
video,
0,
0,
canvas.width,
canvas.height
);


const foto =
canvas.toDataURL(
"image/jpeg",
0.8
);


// Simpan sementara

sessionStorage.setItem(
"fotoAbsensi",
foto
);


// Matikan kamera

if (stream) {

stream
.getTracks()
.forEach(
function(track) {

track.stop();

});

}


document.getElementById(
"status"
).innerHTML =

"✅ FOTO BERHASIL DIAMBIL";


// Tampilkan hasil

const gambar =
document.createElement("img");

gambar.src = foto;

gambar.style.width = "100%";

gambar.style.marginTop = "15px";

gambar.style.borderRadius = "15px";


document.querySelector(
".container"
).appendChild(gambar);

}

</script>

</body>

</html>

<!DOCTYPE html>
<html>
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Kamera Absensi MTsN 8 Kediri</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 15px;
      font-family: Arial, sans-serif;
      background: #eef7f1;
      text-align: center;
    }

    .container {
      max-width: 480px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,.15);
    }

    h2 {
      color: #087443;
      margin-bottom: 5px;
    }

    p {
      color: #555;
    }

    video {
      width: 100%;
      border-radius: 15px;
      background: #000;
      margin-top: 15px;
      display: block;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 15px;
      border: none;
      border-radius: 10px;
      background: #087443;
      color: white;
      font-size: 17px;
      font-weight: bold;
    }

    button:disabled {
      background: #999;
    }

    #status {
      margin-top: 15px;
      font-weight: bold;
      line-height: 1.6;
    }

    #hasil {
      width: 100%;
      margin-top: 15px;
      border-radius: 15px;
      display: none;
    }

  </style>

</head>


<body>


<div class="container">

  <h2>📷 KAMERA ABSENSI</h2>

  <p>MTsN 8 Kediri</p>


  <video
    id="kamera"
    autoplay
    muted
    playsinline>
  </video>


  <button
    id="btnKamera"
    onclick="bukaKamera()">

    📷 BUKA KAMERA

  </button>


  <button
    id="btnFoto"
    onclick="ambilFoto()"
    disabled>

    📸 AMBIL FOTO

  </button>


  <canvas
    id="canvas"
    style="display:none;">
  </canvas>


  <img
    id="hasil"
    alt="Foto hasil absensi">


  <div id="status">

    Silakan tekan BUKA KAMERA.

  </div>


</div>


<script>


// =====================================================
// AMBIL PARAMETER DARI URL
// =====================================================

const params =
  new URLSearchParams(
    window.location.search
  );


const returnURL =
  params.get("return");


let stream = null;


// =====================================================
// BUKA KAMERA
// =====================================================

async function bukaKamera() {


  const video =
    document.getElementById(
      "kamera"
    );


  const tombolKamera =
    document.getElementById(
      "btnKamera"
    );


  const tombolFoto =
    document.getElementById(
      "btnFoto"
    );


  const status =
    document.getElementById(
      "status"
    );


  try {


    status.innerHTML =
      "⏳ Meminta izin kamera...";


    // ---------------------------------------------
    // CEK KAMERA
    // ---------------------------------------------

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        "Browser tidak mendukung kamera."
      );

    }


    // ---------------------------------------------
    // MEMINTA KAMERA DEPAN
    // ---------------------------------------------

    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode: {
            ideal: "user"
          },

          width: {
            ideal: 1280
          },

          height: {
            ideal: 720
          }

        },

        audio: false

      });


    // ---------------------------------------------
    // TAMPILKAN KAMERA
    // ---------------------------------------------

    video.srcObject =
      stream;


    await video.play();


    tombolFoto.disabled =
      false;


    tombolKamera.disabled =
      true;


    status.innerHTML =
      "✅ Kamera berhasil dibuka.<br>" +
      "Silakan tekan AMBIL FOTO.";


  }

  catch(error) {


    console.error(error);


    status.innerHTML =

      "❌ Kamera gagal dibuka.<br><br>" +

      error.name +
      "<br>" +

      error.message;


    alert(

      "KAMERA GAGAL DIBUKA\n\n" +

      error.name +
      "\n" +

      error.message

    );

  }

}


// =====================================================
// AMBIL FOTO
// =====================================================

function ambilFoto() {


  const video =
    document.getElementById(
      "kamera"
    );


  const canvas =
    document.getElementById(
      "canvas"
    );


  const hasil =
    document.getElementById(
      "hasil"
    );


  const status =
    document.getElementById(
      "status"
    );


  if (
    !video.videoWidth ||
    !video.videoHeight
  ) {

    alert(
      "Kamera belum siap."
    );

    return;

  }


  // ---------------------------------------------
  // UKURAN FOTO
  // ---------------------------------------------

  canvas.width =
    video.videoWidth;


  canvas.height =
    video.videoHeight;


  // ---------------------------------------------
  // AMBIL GAMBAR
  // ---------------------------------------------

  const ctx =
    canvas.getContext("2d");


  ctx.drawImage(

    video,

    0,
    0,

    canvas.width,
    canvas.height

  );


  // ---------------------------------------------
  // JADIKAN BASE64
  // ---------------------------------------------

  const foto =
    canvas.toDataURL(
      "image/jpeg",
      0.8
    );


  // ---------------------------------------------
  // SIMPAN SEMENTARA
  // ---------------------------------------------

  sessionStorage.setItem(
    "fotoAbsensi",
    foto
  );


  // ---------------------------------------------
  // TAMPILKAN FOTO
  // ---------------------------------------------

  hasil.src =
    foto;


  hasil.style.display =
    "block";


  status.innerHTML =
    "✅ FOTO BERHASIL DIAMBIL.<br>" +
    "Mengembalikan ke aplikasi...";


  // ---------------------------------------------
  // MATIKAN KAMERA
  // ---------------------------------------------

  if (stream) {

    stream
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );

  }


  // ---------------------------------------------
  // KEMBALI KE APLIKASI
  // ---------------------------------------------

  setTimeout(
    function() {

      if (returnURL) {

        window.location.href =
          returnURL;

      }

      else {

        alert(
          "Alamat kembali tidak ditemukan."
        );

      }

    },
    1000
  );

}


</script>


</body>
</html>

<!DOCTYPE html>
<html>

<head>

<meta
name="viewport"
content="width=device-width, initial-scale=1">

<title>
Kamera Absensi MTsN 8 Kediri
</title>

<style>

body {

margin:0;
padding:15px;

font-family:Arial,sans-serif;

background:#eef7f1;

text-align:center;

}

.container {

max-width:480px;

margin:auto;

background:white;

padding:20px;

border-radius:20px;

box-shadow:
0 4px 15px
rgba(0,0,0,.15);

}

h2 {

color:#087443;

}

video {

width:100%;

border-radius:15px;

background:black;

margin-top:15px;

}

button {

width:100%;

padding:16px;

margin-top:15px;

border:none;

border-radius:10px;

background:#087443;

color:white;

font-size:17px;

font-weight:bold;

}

button:disabled {

background:#999;

}

#status {

margin-top:15px;

font-weight:bold;

line-height:1.6;

}

</style>

</head>


<body>


<div class="container">


<h2>
📷 KAMERA ABSENSI
</h2>


<p>
MTsN 8 Kediri
</p>


<video
id="kamera"
autoplay
playsinline>
</video>


<canvas
id="canvas"
style="display:none;">
</canvas>


<button
id="btnFoto"
onclick="ambilFoto()"
disabled>

📸 AMBIL FOTO

</button>


<div id="status">
⏳ Menyiapkan kamera...
</div>


</div>


<script>


// =======================================
// APPS SCRIPT
// =======================================

const APP_URL =
"https://script.google.com/macros/s/AKfycbwDgGxOWo8dmFxOtwPXbcb9m_eDTkjtW5yqNsKeGsIqGax0SYFYZ0lClzFqDTAtkMrM/exec";


// =======================================
// AMBIL TOKEN DARI URL
// =======================================

const params =
new URLSearchParams(
window.location.search
);


const token =
params.get("token");


const returnURL =
params.get("return");


let stream = null;


// =======================================
// CEK TOKEN
// =======================================

if (!token) {

document.getElementById(
"status"
).innerHTML =

"❌ Token foto tidak ditemukan.<br>" +
"Silakan kembali ke aplikasi absensi.";

document.getElementById(
"btnFoto"
).disabled = true;

}


// =======================================
// BUKA KAMERA
// =======================================

async function bukaKamera() {

try {

if (
!navigator.mediaDevices ||
!navigator.mediaDevices.getUserMedia
) {

throw new Error(
"Kamera tidak didukung browser."
);

}


stream =
await navigator.mediaDevices
.getUserMedia({

video:{
facingMode:"user"
},

audio:false

});


const kamera =
document.getElementById(
"kamera"
);


kamera.srcObject =
stream;


document.getElementById(
"btnFoto"
).disabled = false;


document.getElementById(
"status"
).innerHTML =

"✅ Kamera siap.<br>" +
"Silakan ambil foto.";

}

catch(error) {

document.getElementById(
"status"
).innerHTML =

"❌ Kamera gagal dibuka.";

alert(

"Kamera tidak dapat dibuka.\n\n" +

"Pastikan izin kamera sudah diberikan.\n\n" +

error.message

);

}

}


// =======================================
// AMBIL FOTO
// =======================================

async function ambilFoto() {

const kamera =
document.getElementById(
"kamera"
);

const canvas =
document.getElementById(
"canvas"
);

const tombol =
document.getElementById(
"btnFoto"
);

const status =
document.getElementById(
"status"
);


if (
!kamera.videoWidth
) {

alert(
"Kamera belum siap."
);

return;

}


tombol.disabled = true;


canvas.width =
kamera.videoWidth;

canvas.height =
kamera.videoHeight;


const ctx =
canvas.getContext(
"2d"
);


ctx.drawImage(

kamera,

0,
0,

canvas.width,
canvas.height

);


const foto =
canvas.toDataURL(
"image/jpeg",
0.6
);


// MATIKAN KAMERA

if (stream) {

stream
.getTracks()
.forEach(
function(track) {

track.stop();

}
);

}


status.innerHTML =
"⏳ Mengirim foto...";


// =======================================
// KIRIM KE APPS SCRIPT
// =======================================

try {

const response =
await fetch(

APP_URL,

{

method:"POST",

mode:"no-cors",

headers:{

"Content-Type":
"application/x-www-form-urlencoded"

},

body:

"token=" +
encodeURIComponent(token) +

"&foto=" +
encodeURIComponent(foto)

}

);


// =======================================
// KEMBALI KE APLIKASI
// =======================================

status.innerHTML =

"✅ Foto berhasil dikirim." +
"<br>" +
"Kembali ke aplikasi...";


setTimeout(
function() {


if (returnURL) {


const separator =
returnURL.includes("?")
? "&"
: "?";


window.location.href =

returnURL +

separator +

"token=" +

encodeURIComponent(
token
);


}

else {


window.location.href =

APP_URL +

"?token=" +

encodeURIComponent(
token
);

}


},
1200
);


}

catch(error) {

status.innerHTML =
"❌ Foto gagal dikirim.";

alert(
error.message
);

tombol.disabled = false;

}

}


// =======================================
// JALANKAN KAMERA
// =======================================

if (token) {

window.addEventListener(
"load",
function() {

bukaKamera();

});

}

</script>


</body>

</html>

<!DOCTYPE html>
<html>
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Kamera Absensi MTsN 8 Kediri</title>

  <style>

    body {
      margin: 0;
      padding: 15px;
      background: #eef7f1;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .container {
      max-width: 480px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,.15);
    }

    h2 {
      color: #087443;
    }

    video {
      width: 100%;
      border-radius: 15px;
      margin-top: 15px;
      background: black;
    }

    canvas {
      display: none;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 15px;
      border: none;
      border-radius: 10px;
      background: #087443;
      color: white;
      font-size: 17px;
      font-weight: bold;
    }

    #status {
      margin-top: 15px;
      font-weight: bold;
    }

  </style>

</head>


<body>


<div class="container">

  <h2>📷 KAMERA ABSENSI</h2>

  <p>
    MTsN 8 Kediri
  </p>


  <video
    id="kamera"
    autoplay
    playsinline
  ></video>


  <canvas id="canvas"></canvas>


  <button
    onclick="ambilFoto()"
  >
    📸 AMBIL FOTO
  </button>


  <div id="status">
    Kamera sedang disiapkan...
  </div>

</div>


<script>

let stream = null;


// =================================================
// BUKA KAMERA
// =================================================

async function bukaKamera() {

  try {

    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: "user"
        },

        audio: false

      });


    const kamera =
      document.getElementById(
        "kamera"
      );


    kamera.srcObject =
      stream;


    document.getElementById(
      "status"
    ).innerHTML =
      "✅ Kamera siap. Silakan ambil foto.";

  }

  catch(error) {

    document.getElementById(
      "status"
    ).innerHTML =
      "❌ Kamera tidak dapat dibuka.";

    alert(
      "Kamera tidak dapat dibuka.\n\n" +
      "Pastikan izin kamera sudah diberikan."
    );

  }

}


// =================================================
// AMBIL FOTO
// =================================================

function ambilFoto() {

  const kamera =
    document.getElementById(
      "kamera"
    );


  const canvas =
    document.getElementById(
      "canvas"
    );


  if (
    !kamera.videoWidth ||
    !kamera.videoHeight
  ) {

    alert(
      "Kamera belum siap. Tunggu beberapa detik."
    );

    return;

  }


  canvas.width =
    kamera.videoWidth;

  canvas.height =
    kamera.videoHeight;


  const ctx =
    canvas.getContext(
      "2d"
    );


  ctx.drawImage(
    kamera,
    0,
    0,
    canvas.width,
    canvas.height
  );


  // ---------------------------------------------
  // UBAH FOTO MENJADI DATA
  // ---------------------------------------------

  const foto =
    canvas.toDataURL(
      "image/jpeg",
      0.7
    );


  document.getElementById(
    "status"
  ).innerHTML =
    "⏳ Foto berhasil diambil. Mengembalikan ke aplikasi...";


  // ---------------------------------------------
  // MATIKAN KAMERA
  // ---------------------------------------------

  if (stream) {

    stream
      .getTracks()
      .forEach(
        function(track) {
          track.stop();
        }
      );

  }


  // ---------------------------------------------
  // KIRIM FOTO KE APLIKASI ABSENSI
  // ---------------------------------------------

  if (
    window.opener &&
    !window.opener.closed
  ) {

    window.opener.postMessage(

      {
        type: "fotoAbsensi",
        foto: foto
      },

      "https://script.google.com"

    );


    setTimeout(
      function() {

        window.close();

      },
      1000
    );


  }

  else {

    // Kalau halaman tidak dibuka sebagai popup

    alert(
      "Foto berhasil diambil.\n\n" +
      "Silakan kembali ke halaman absensi."
    );

  }

}


// =================================================
// JALANKAN KAMERA
// =================================================

window.addEventListener(
  "load",
  bukaKamera
);

</script>


</body>
</html>
